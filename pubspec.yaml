name: mauritania_plate
description: "Mauritania's licence plates for the plate_core library — the Euro-style blue-on-white plate and its red variant, with the regional codes and an advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/mauritania_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/Mauritania_map.svg
